[workspace.package]
version = "0.8.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/near/near-lake-framework-rs"
description = "Library to connect to the NEAR Lake S3 and stream the data"
categories = ["asynchronous", "api-bindings", "network-programming"]
keywords = ["near", "near-lake", "near-indexer"]
authors = ["Near Inc <hello@nearprotocol.com>"]
rust-version = "1.95.0"

[workspace]
resolver = "3"
members = [
    "lake-framework",
    "lake-primitives",
    "lake-parent-transaction-cache",
    "lake-context-derive",
]

[workspace.dependencies]
near-lake-framework = { path = "lake-framework", version = "0.8.0-beta.6" }
near-lake-primitives = { path = "lake-primitives", version = "0.8.0-beta.6" }
near-lake-context-derive = { path = "lake-context-derive", version = "0.8.0-beta.6" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "=1.6.1"
aws-types = "1"
bytes = "1"
cached = "4"
derive_builder = "0.20"
diesel = { version = "2", features = ["postgres_backend", "postgres"] }
futures = "0.3"
near-crypto = "0.38.0-rc.2"
near-indexer-primitives = "0.38.0-rc.2"
near-primitives = "0.38.0-rc.2"
once_cell = "1"
paste = "1"
quote = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread"] }
tokio-stream = { version = "0.1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
